<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cookie Cats: Player Retention Dashboard</title>
  <!-- 1. Load the ECharts library from a CDN -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <!-- 2. Load our query results (created by export_data.py) -->
  <script src="data.js"></script>
  <style>
    body  { font-family: Arial, sans-serif; margin: 24px; background: #fafafa; color: #222; }
    h1    { margin-bottom: 4px; }
    p.sub { color: #555; margin-top: 0; }
    .chart { width: 100%; max-width: 820px; height: 380px; background: #fff;
             border: 1px solid #ddd; border-radius: 8px; margin-bottom: 24px; }
  </style>
</head>
<body>
  <h1>Cookie Cats: Does Moving the First Gate Affect Retention?</h1>
  <p class="sub">A/B test of 90,188 players (1 outlier removed). gate_30 = first gate at level 30, gate_40 = level 40.</p>

  <!-- 3. Empty boxes that ECharts will draw into -->
  <div id="chart1" class="chart"></div>
  <div id="chart2" class="chart"></div>

  <script>
    // ---------- CHART 1: Day-1 and Day-7 retention by A/B group (grouped bars) ----------
    // echarts.init() attaches a chart to the empty <div> with id "chart1"
    const chart1 = echarts.init(document.getElementById("chart1"));

    // An ECharts chart is one big settings object (like a Python dict)
    const option1 = {
      title:   { text: "Retention by A/B Group", left: "center" },
      tooltip: { trigger: "axis" },                   // show values when hovering
      legend:  { top: 30 },                           // shows series names
      xAxis:   { type: "category", data: DATA.groups },         // ["gate_30", "gate_40"]
      yAxis:   { type: "value", name: "% of players retained" },
      series: [
        { name: "Day 1", type: "bar", data: DATA.day1, label: { show: true, position: "top" } },
        { name: "Day 7", type: "bar", data: DATA.day7, label: { show: true, position: "top" } }
      ]
    };
    chart1.setOption(option1);   // draw it

    // ---------- CHART 2: Day-7 retention by engagement tier (one line per A/B group) ----------
    const chart2 = echarts.init(document.getElementById("chart2"));
    const option2 = {
      title:   { text: "Day-7 Retention by Engagement Tier", left: "center" },
      tooltip: { trigger: "axis" },
      legend:  { top: 30 },
      xAxis:   { type: "category", name: "Rounds played", nameLocation: "middle", nameGap: 30,
                 data: DATA.tiers },                       // ["0 rounds", "1-29", "30-39", "40-99", "100+"]
      yAxis:   { type: "value", name: "% retained at day 7" },
      series: [
        { name: "gate_30", type: "line", data: DATA.tier_gate30, label: { show: true, position: "top" } },
        { name: "gate_40", type: "line", data: DATA.tier_gate40, label: { show: true, position: "bottom" } }
      ]
    };
    chart2.setOption(option2);
        

    // Resize charts when the browser window changes size
    window.addEventListener("resize", () => { chart1.resize(); chart2.resize(); });
  </script>
</body>
</html>
